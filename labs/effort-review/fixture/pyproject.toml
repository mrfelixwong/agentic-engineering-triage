[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.1.0"
description = "Triage — a small support-ticket assistant. The Practice Repo's verification slice (Module 3)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# The LLM provider wrapper. Optional: the classifier runs OFFLINE with a
# deterministic stub when this isn't installed or no API key is set, so tests
# and the eval run with no network and no key.
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",          # FastAPI TestClient transport
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
